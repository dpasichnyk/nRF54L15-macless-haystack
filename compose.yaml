services:
  anisette:
    image: dadoum/anisette-v3-server@sha256:1e20384985d3c49965f444bef39d627768dacc39ea0dca91f2a535edb7591ba3
    restart: unless-stopped
    volumes:
      - anisette-state:/home/Alcoholic/.config/anisette-v3

  endpoint:
    build:
      context: .
      dockerfile: Dockerfile.macless-haystack
    depends_on:
      - anisette
    ports:
      - 127.0.0.1:6176:6176
    restart: unless-stopped
    volumes:
      - ./deploy/endpoint:/app/endpoint/data

volumes:
  anisette-state:
