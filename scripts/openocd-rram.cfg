# NCS v3.2.1's XIAO loader enables buffered RRAM writes but does not commit
# a partial final buffer. Resetting before COMMITWRITEBUF loses the image tail.
# Load after the SDK board configuration to override its nrf54l-load procedure.
proc nrf54l-load {file} {
	mww 0x5004b500 0x101
	load_image $file
	mww 0x5004b008 1
	for {set attempt 0} {$attempt < 100} {incr attempt} {
		if {[lindex [read_memory 0x5004b418 32 1] 0] == 1} {
			mww 0x5004b500 0
			return
		}
		sleep 1
	}
	error "RRAMC write buffer did not commit; refusing to reset or verify"
}
