name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Run sanitized host tests and Python checks
        run: make test-firmware

  deployment-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Check readiness and isolated deployment contract
        run: make test-deploy

  tracking-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Check persistent tracking and outage recovery
        run: make test-tracking

  firmware-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production
            extra_conf: ""
          - profile: development
            extra_conf: debug.conf
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:2c19052c8e6c00b9575f43a4a1b544f36692b2f160e6a3d2ab3fa6e8ec102b18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: nrf5-tag
      - name: Initialize NCS workspace
        run: |
          west init -l nrf5-tag
          west update -o=--depth=1 -n
      - name: Compile profile with example keys (not a release image)
        run: >-
          west build --pristine=always --no-sysbuild
          -b xiao_nrf54l15/nrf54l15/cpuapp -d build nrf5-tag
          -- -DBEACON_ALLOW_EXAMPLE_KEYS=ON
          -DEXTRA_CONF_FILE="${{ matrix.extra_conf }}"
      - name: Verify resolved profile configuration
        run: >-
          cmake -DBUILD_DIR="$PWD/build" -DPROFILE=${{ matrix.profile }}
          -P nrf5-tag/tests/firmware/check_profile.cmake
