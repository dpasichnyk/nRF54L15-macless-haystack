# Bluetooth broadcaster only. No connections, scanning, names, or scan response.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_ID_MAX=2
CONFIG_BT_EXT_ADV=n
CONFIG_BT_DEVICE_NAME=""

# Runtime state and diagnostics expected by the radio implementation.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_REBOOT=y

# Keep the image small and avoid unused host features.
CONFIG_BT_SETTINGS=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
