# Bluetooth broadcaster only. No connections, scanning, names, or scan response.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_ID_MAX=2
CONFIG_BT_EXT_ADV=n
CONFIG_BT_DEVICE_NAME=""

# Production beacon: no UART receiver or periodic log-processing wakeups.
# Add debug.conf explicitly when USB/SWD RTT diagnostics are needed.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_REBOOT=y

# This broadcaster uses static pools, not the libc post-image malloc arena.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# Keep the image small and avoid unused host features.
CONFIG_BT_SETTINGS=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
