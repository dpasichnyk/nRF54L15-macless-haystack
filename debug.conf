# Development only: RTT over the onboard USB/SWD probe; no external UART needed.
# Drop normal logs when detached rather than blocking the radio thread.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_NCS_BOOT_BANNER=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=256
CONFIG_ASSERT=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_RAM_POWER_DOWN_LIBRARY=n
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
